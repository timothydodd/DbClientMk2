version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - "tauri*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@uiw/*"
      tauri:
        patterns:
          - "@tauri-apps/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
