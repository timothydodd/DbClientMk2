[workspace]
resolver = "2"
members = [
  "crates/dbclient-core",
  "crates/dbclient-data",
  "crates/dbclient-store",
  "crates/dbclient-engine",
  "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/timothydodd/dbclient"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
