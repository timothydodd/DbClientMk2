<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background: deep slate, lighter at the top -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#151d26"/>
    </linearGradient>
    <!-- Border: red accent -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b78"/>
      <stop offset="100%" stop-color="#a81c2b"/>
    </linearGradient>
    <!-- Cylinder body: left-to-right shading -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a7fa6"/>
      <stop offset="45%" stop-color="#6fa6cf"/>
      <stop offset="100%" stop-color="#3d6b8d"/>
    </linearGradient>
    <!-- Cylinder top -->
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a86"/>
      <stop offset="100%" stop-color="#e02a3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background with accent border -->
  <rect x="8" y="8" width="224" height="224" rx="44" ry="44" fill="url(#bg)" stroke="url(#border)" stroke-width="8"/>
  <!-- Subtle inner highlight along the top edge -->
  <rect x="16" y="16" width="208" height="104" rx="36" ry="36" fill="#ffffff" opacity="0.04"/>

  <!-- "db" lettering (Ubuntu Bold; falls back to any bold sans) -->
  <text x="120" y="120" font-family="Ubuntu, 'Segoe UI', Inter, Arial, sans-serif" font-size="150" font-weight="700"
        fill="url(#top)" stroke="#5a0f18" stroke-width="3" paint-order="stroke" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-6" filter="url(#shadow)">db</text>
</svg>
