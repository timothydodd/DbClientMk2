[package]
name = "dbclient-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Database drivers for dbclient: SQL Server, MySQL, SQLite, SSH tunnels"

[dependencies]
dbclient-core = { path = "../dbclient-core" }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
chrono = { workspace = true }
# SQL Server. TLS backend is chosen per target below: platform TLS (schannel) on Windows/Linux,
# rustls on macOS.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "chrono", "rust_decimal", "sql-browser-tokio"] }
# MySQL / MariaDB over rustls with the ring provider.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring", "minimal-rust"] }
rusqlite = { version = "0.41.1", features = ["bundled", "column_decltype"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
sha2 = "0.11"
md-5 = "0.11"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }

# Windows/Linux: platform TLS, so no OpenSSL-from-source or aws-lc-rs (cmake/nasm) in the tree.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["native-tls"] }

# macOS: native-tls there is Secure Transport, which stops at TLS 1.2, so Azure SQL servers
# requiring TLS 1.3 fail the handshake ("connection closed via error"). rustls does 1.3.
# This brings aws-lc-rs in for macOS only; it builds fine with the Xcode toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["registry", "std"]
